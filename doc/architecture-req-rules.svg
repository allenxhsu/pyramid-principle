</style><rect x="-26" y="-36" width="2112" height="536" fill="#fff"/><rect class="d-frame" x="-10" y="-20" width="2080" height="504"/><path class="d-frame-tab" d="M-10 -20h206.2v14l-10 10H-10z"/><text class="d-mono" x="0" y="-4">req [package] Rules [Rules]</text><g class="d-symbols"><g class="d-sym c-b" data-sym="sy_044" transform="translate(40 40)"><rect class="d-shape" width="304" height="120"/><text class="d-mono" x="152" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="152" y="36" text-anchor="middle">Clocks move only for what changed</text><path class="d-rule" d="M0 46H304"/><text x="10" y="64">id = &quot;PY1&quot;</text><text x="10" y="80">text = &quot;A record whose body is unchanged shall</text><text x="10" y="96">keep its updatedAt; a save that changes</text><text x="10" y="112">nothing writes nothing.&quot;</text></g><g class="d-sym c-b" data-sym="sy_045" transform="translate(370 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Deletions are tombstones</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;PY2&quot;</text><text x="10" y="80">text = &quot;A record that leaves the document</text><text x="10" y="96">shall be written back with deletedAt set, and</text><text x="10" y="112">exports shall carry tombstones.&quot;</text></g><g class="d-sym c-b" data-sym="sy_046" transform="translate(700 40)"><rect class="d-shape" width="300" height="104"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Never swap under the caret</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;PY3&quot;</text><text x="10" y="80">text = &quot;Arriving changes shall wait while the</text><text x="10" y="96">caret is in a field, and the app shall say so.&quot;</text></g><g class="d-sym c-b" data-sym="sy_047" transform="translate(1030 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">No external origin</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;PY4&quot;</text><text x="10" y="80">text = &quot;The page shall reference no external</text><text x="10" y="96">origin — fonts included — so an installed copy</text><text x="10" y="112">works in airplane mode.&quot;</text></g><g class="d-sym c-b" data-sym="sy_048" transform="translate(1360 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Prefixed storage</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;PY5&quot;</text><text x="10" y="80">text = &quot;Everything the app owns shall be</text><text x="10" y="96">named pyramid.*; ui-kit.* stays shared on</text><text x="10" y="112">purpose.&quot;</text></g><g class="d-sym c-b" data-sym="sy_049" transform="translate(1690 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Round-trips keep the analysis</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;PY6&quot;</text><text x="10" y="80">text = &quot;Pyramid’s own state shall travel</text><text x="10" y="96">under x-pyramid, so a round-trip does not</text><text x="10" y="112">silently lose it.&quot;</text></g><g class="d-sym " data-sym="sy_050" transform="translate(210 330)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Record projection</text></g><g class="d-sym " data-sym="sy_051" transform="translate(700 330)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Sync</text></g><g class="d-sym c-b" data-sym="sy_052" transform="translate(970 330)"><rect class="d-shape" width="200" height="104"/><text class="d-mono" x="100" y="19" text-anchor="middle">«testCase»</text><text class="d-name" x="100" y="36" text-anchor="middle">check-inline.mjs</text><path class="d-rule" d="M0 46H200"/><text x="10" y="64">Fails when the inlined kit</text><text x="10" y="80">copies drift from ../ui-kit</text><text x="10" y="96">and ../sync-kit.</text></g><g class="d-sym " data-sym="sy_053" transform="translate(1200 330)"><rect class="d-shape" width="220" height="50"/><text class="d-mono" x="110" y="19" text-anchor="middle">«block»</text><text class="d-name" x="110" y="36" text-anchor="middle">Pyramid Principle</text></g><g class="d-sym " data-sym="sy_054" transform="translate(1490 330)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Persistence</text></g><g class="d-sym " data-sym="sy_055" transform="translate(1820 330)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Exporters</text></g></g><g class="d-paths"><g class="d-path" data-path="pa_039"><path class="d-hit" d="M277 330L277 245L192 245L192 160"/><path class="d-line dashed" d="M277 330L277 245L192 245L192 160"/><path class="d-head" transform="translate(192 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="283" y="280.5" width="67.4" height="15"/><text class="d-mono" x="316.7" y="291.5" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_040"><path class="d-hit" d="M343 330L343 245L520 245L520 160"/><path class="d-line dashed" d="M343 330L343 245L520 245L520 160"/><path class="d-head" transform="translate(520 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="397.8" y="227" width="67.4" height="15"/><text class="d-mono" x="431.5" y="238" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_041"><path class="d-hit" d="M800 330L800 237L850 237L850 144"/><path class="d-line dashed" d="M800 330L800 237L850 237L850 144"/><path class="d-head" transform="translate(850 144) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="806" y="276.5" width="67.4" height="15"/><text class="d-mono" x="839.7" y="287.5" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_042"><path class="d-hit" d="M1070 330L1070 245L1130 245L1130 160"/><path class="d-line dashed" d="M1070 330L1070 245L1130 245L1130 160"/><path class="d-head" transform="translate(1130 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="1076" y="280.5" width="60.8" height="15"/><text class="d-mono" x="1106.4" y="291.5" text-anchor="middle">«verify»</text></g><g class="d-path" data-path="pa_043"><path class="d-hit" d="M1310 330L1310 245L1230 245L1230 160"/><path class="d-line dashed" d="M1310 330L1310 245L1230 245L1230 160"/><path class="d-head" transform="translate(1230 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="1316" y="280.5" width="67.4" height="15"/><text class="d-mono" x="1349.7" y="291.5" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_044"><path class="d-hit" d="M1590 330L1590 245L1510 245L1510 160"/><path class="d-line dashed" d="M1590 330L1590 245L1510 245L1510 160"/><path class="d-head" transform="translate(1510 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="1596" y="280.5" width="67.4" height="15"/><text class="d-mono" x="1629.7" y="291.5" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_045"><path class="d-hit" d="M1920 330L1920 245L1840 245L1840 160"/><path class="d-line dashed" d="M1920 330L1920 245L1840 245L1840 160"/><path class="d-head" transform="translate(1840 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="1926" y="280.5" width="67.4" height="15"/><text class="d-mono" x="1959.7" y="291.5" text-anchor="middle">«satisfy»</text></g></g><g class="d-ports"></g></svg>
